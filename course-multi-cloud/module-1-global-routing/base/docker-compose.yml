version: '3.8'

services:
  lb-mock-aws:
    image: nginx:alpine
    container_name: lb-mock-aws
    ports:
      - "8081:80"
    volumes:
      - ./aws.html:/usr/share/nginx/html/index.html
    restart: always

  lb-mock-gcp:
    image: nginx:alpine
    container_name: lb-mock-gcp
    ports:
      - "8082:80"
    volumes:
      - ./gcp.html:/usr/share/nginx/html/index.html
    restart: always

  gtm-edge-dns:
    image: haproxy:alpine
    container_name: gtm-edge-dns
    ports:
      - "8080:80"
      - "1936:1936"

    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - lb-mock-aws
      - lb-mock-gcp
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    restart: always


networks:
  default:
    name: multi-cloud-network


