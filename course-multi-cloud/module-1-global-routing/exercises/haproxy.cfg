global
    log stdout format raw local0

defaults
    log     global
    mode    http
    timeout connect 2s
    timeout client  5s
    timeout server  5s

frontend http_front
    bind *:80
    default_backend web_servers

backend web_servers
    balance roundrobin
    server aws lb-mock-aws:80 check inter 1s fall 2 rise 2
    server gcp lb-mock-gcp:80 check inter 1s fall 2 rise 2 backup

frontend stats
    bind *:1936
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    http-request use-service prometheus-exporter if { path /metrics }
