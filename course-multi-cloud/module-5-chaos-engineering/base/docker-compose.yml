version: '3.8'

services:
  chaos-aws:
    image: alpine:latest
    container_name: chaos-aws
    command: sh -c "apk add --no-cache iproute2 iptables iputils && sleep 36000"
    cap_add:
      - NET_ADMIN
    restart: always

  chaos-gcp:
    image: alpine:latest
    container_name: chaos-gcp
    command: sh -c "apk add --no-cache iproute2 iptables iputils && sleep 36000"
    cap_add:
      - NET_ADMIN
    restart: always

networks:
  default:
    name: multi-cloud-network

