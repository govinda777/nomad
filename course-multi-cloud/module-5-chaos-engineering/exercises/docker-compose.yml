version: '3.8'

services:
  chaos-aws:
    image: alpine:latest
    container_name: chaos-aws
    command: sh -c "apk add --no-cache iproute2 iptables iputils && sleep 36000"
    # TODO: Add the Linux kernel networking capability required for traffic shaping and firewall manipulation
    # Hint: Use cap_add list with NET_ADMIN capability.
    restart: always

  chaos-gcp:
    image: alpine:latest
    container_name: chaos-gcp
    command: sh -c "apk add --no-cache iproute2 iptables iputils && sleep 36000"
    # TODO: Add the Linux kernel networking capability required for traffic shaping and firewall manipulation
    # Hint: Use cap_add list with NET_ADMIN capability.
    restart: always
